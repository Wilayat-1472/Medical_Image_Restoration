project:
  name: "Medical Image Restoration"
  version: "1.0.0"
  seed: 42

model:
  name: "light_unet"
  in_channels: 3
  out_channels: 3
  image_size: 256

  light_unet:
    base_filters: 32
    depth: 4
    use_se: true

  restormer_unet:
    dim: 48
    num_blocks: [4, 6, 6, 8]
    num_heads: [1, 2, 4, 8]
    ffn_expansion_factor: 2.66
    bias: false
    LayerNorm_type: "BiasFree"

training:
  framework: "pytorch_lightning"
  accelerator: "auto"
  devices: 1
  max_epochs: 100
  precision: "32"
  log_every_n_steps: 50
  save_checkpoint_every_n_epochs: 10

  optimizer:
    name: "adam"
    lr: 0.001
    weight_decay: 0.0001

  scheduler:
    name: "cosine_annealing"
    T_max: 100
    eta_min: 1.0e-7

  batch_size: 4
  num_workers: 2
  pin_memory: true

loss:
  l1_weight: 0.4
  ssim_weight: 0.3
  perceptual_weight: 0.2
  charbonnier_weight: 0.1

data:
  target_size: 256
  modalities: ["ct", "mri", "xray", "retinal", "ultrasound"]
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

  augmentation:
    horizontal_flip: true
    vertical_flip: true
    random_rotation: true

  degradation:
    gaussian_noise:
      enabled: true
      std_range: [5, 70]
    salt_pepper_noise:
      enabled: true
      amount_range: [0.01, 0.50]
    speckle_noise:
      enabled: true
      std_range: [0.01, 0.15]
    motion_blur:
      enabled: true
      kernel_size_range: [3, 31]
      angle_range: [0, 360]
    gaussian_blur:
      enabled: true
      kernel_size_range: [3, 31]
      sigma_range: [0.5, 5.0]
    defocus_blur:
      enabled: true
      radius_range: [1, 15]
    contrast_reduction:
      enabled: true
      factor_range: [0.3, 1.0]
    compression:
      enabled: true
      quality_range: [10, 90]
    mixed_degradation:
      enabled: true
      max_degradations: 3

evaluation:
  metrics: ["psnr", "ssim", "mse", "mae"]
  edge_case_testing:
    noise_levels: [5, 10, 20, 30, 50, 70]
    blur_kernels: [3, 5, 7, 11, 15, 21, 31]
    mixed_degradation: true

inference:
  confidence_threshold: 0.6
  fail_safe: true
  save_output: true
  output_format: "png"
