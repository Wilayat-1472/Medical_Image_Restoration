__include__: default.yaml

# Train the deployable CPU model faster on a T4.
model:
  name: light_unet

training:
  accelerator: gpu
  precision: 16-mixed
  max_epochs: 30
  batch_size: 16
  num_workers: 2
  optimizer:
    name: adamw
    lr: 0.0003
  scheduler:
    T_max: 30

data:
  target_size: 128

# No external VGG download needed for this baseline.
loss:
  l1_weight: 0.6
  ssim_weight: 0.3
  perceptual_weight: 0.0
  charbonnier_weight: 0.1
