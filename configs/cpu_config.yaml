__include__: "default.yaml"

model:
  name: "light_unet"

training:
  accelerator: "cpu"
  devices: 1
  precision: "32"
  max_epochs: 50
  batch_size: 2
  num_workers: 0

  optimizer:
    name: "adam"
    lr: 0.0005

data:
  target_size: 128

loss:
  l1_weight: 0.6
  ssim_weight: 0.3
  perceptual_weight: 0.0
  charbonnier_weight: 0.1
